syntax = "proto3";

package dbcache;
option go_package = "/internal/genproto";

message DBCacheRequest {
  string query_id = 1;
}

message DBCacheResponse {
  string data = 1;
  bool from_cache = 2; 
}

message HealthCheckRequest {}
message HealthCheckResponse {
  bool healthy = 1;
}

service DBCacheService {
  rpc GetData(DBCacheRequest) returns (DBCacheResponse);
  rpc CheckHealth(HealthCheckRequest) returns (HealthCheckResponse);
}
